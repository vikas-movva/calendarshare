[package]
name = "calendarshare"
version = "0.1.0"
edition = "2021"
description = "CalendarShare backend: share calendar slices via secure, expiring links."
license = "MIT"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
axum-extra = { version = "0.9", features = ["cookie"] }
cookie = "0.18"
time = "0.3"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip", "fs", "util"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid", "migrate"] }
reqwest = { version = "0.12", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
aes-gcm = "0.10"
base64 = "0.22"
dotenvy = "0.15"
thiserror = "1"
anyhow = "1"
url = "2"
urlencoding = "2"

[dev-dependencies]